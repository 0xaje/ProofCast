name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, browser flow, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DATABASE_URL: mysql://root:root@127.0.0.1:3306/proofcast_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: proofcast_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run TypeScript check
        run: pnpm check

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate isolated E2E database
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: pnpm drizzle-kit migrate

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Build production bundle
        run: pnpm build
